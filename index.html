<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EC025 Tutorial Board</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="EC025 Board">
<meta name="theme-color" content="#F6F4FC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a frosted-glass chapter list on the left; each question opens at the top of its own paper whiteboard, with the pens kept in a glass tool rack beside it. Palette: glassy pastels (lavender, sky, mint, butter) with a periwinkle accent; no pink. */
  --nude:#F6F4FC;
  --sand:#E3E0F5;
  --ink:#2D2A44;
  --muted:#686583;
  --accent:#5A67D0;
  --accent2:#3FA58E;
  --paper:#FCFCFF;
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.84);
  --glass-edge:rgba(255,255,255,.85);
  --hair:rgba(70,72,120,.14);
  --wash:rgba(90,103,208,.12);
  --shadow:0 22px 44px -22px rgba(60,62,120,.38),0 2px 8px rgba(60,62,120,.07);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --side-w:296px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--nude);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- backdrop ---------- */
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(44% 54% at 6% 94%, rgba(168,230,206,.8), transparent 70%),
    radial-gradient(40% 48% at 94% 6%, rgba(203,192,252,.85), transparent 70%),
    radial-gradient(34% 42% at 72% 88%, rgba(253,234,160,.7), transparent 72%),
    radial-gradient(36% 40% at 38% 22%, rgba(190,224,253,.75), transparent 70%),
    radial-gradient(30% 34% at 18% 40%, rgba(222,214,255,.6), transparent 70%),
    linear-gradient(160deg,#F7F5FF 0%,#F0F5FE 55%,#EEF8F5 100%);}
.backdrop svg{position:absolute;inset:0;width:100%;height:100%}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);gap:14px;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  transition:grid-template-columns .28s ease}
.glass{background:linear-gradient(140deg,rgba(255,255,255,.74),rgba(255,255,255,.4));-webkit-backdrop-filter:blur(24px) saturate(1.7);backdrop-filter:blur(24px) saturate(1.7);
  border:1px solid var(--glass-edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.85)}

/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;min-height:0;border-radius:var(--r-lg);overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;padding:18px 18px 12px;text-align:left;width:100%}
.brand-mark{width:42px;height:42px;flex:none}
.brand-t{font-family:var(--f-display);font-weight:750;font-size:19px;line-height:1.1;letter-spacing:-.015em}
.brand-s{font-size:13px;color:var(--muted)}
.search{margin:4px 14px 10px;position:relative}
.search input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:rgba(255,255,255,.55);border:1px solid var(--hair);
  border-radius:12px;padding:10px 12px 10px 38px;-webkit-user-select:text;user-select:text;outline:none}
.search input::placeholder{color:#9894B0}
.search input:focus{border-color:rgba(90,103,208,.5);background:rgba(255,255,255,.8)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.nav{flex:1;min-height:0;overflow:auto;padding:2px 10px 12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.chap{border-radius:14px;margin-bottom:2px}
.chap.open{background:rgba(255,255,255,.34)}
.chap-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;padding:8px;border-radius:12px;text-align:left}
.chap-head:hover{background:rgba(255,255,255,.4)}
.mini{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:750;font-size:16px;font-variant-numeric:tabular-nums;
  background:linear-gradient(150deg,rgba(255,255,255,.85),rgba(255,255,255,.35));border:1px solid rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(60,62,120,.1)}
.mini[data-g="phys"]{background:linear-gradient(150deg,rgba(240,248,255,.95),rgba(170,210,250,.7))}
.mini[data-g="org"]{background:linear-gradient(150deg,rgba(238,252,246,.95),rgba(156,224,198,.7))}
.chap-title{font-weight:700;font-size:15px;line-height:1.2}
.chap-count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.secs{display:none;padding:2px 6px 10px 18px}
.chap.open .secs{display:block}
.sec{display:grid;grid-template-columns:42px 1fr auto;align-items:baseline;gap:6px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:14.5px;line-height:1.25;border-left:2px solid var(--hair);border-top-left-radius:0;border-bottom-left-radius:0}
.sec:hover{background:rgba(255,255,255,.5)}
.sec.cur{background:var(--glass-strong);border-left-color:var(--accent);box-shadow:0 2px 10px -4px rgba(60,62,120,.25)}
.sec-num{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;font-size:13.5px}
.sec-num.tag{font-size:10.5px;font-weight:700;color:var(--accent2);letter-spacing:.02em}
.sec-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{padding:10px 14px 14px;display:grid;gap:8px;border-top:1px solid var(--hair)}
.role{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.35}
.role .dot{width:9px;height:9px;border-radius:50%;background:#BDB9D6;margin-top:4px;flex:none}
.role[data-role="lecturer"] .dot{background:var(--accent)}
.role[data-role="student"] .dot{background:var(--accent2)}
.role strong{color:var(--ink);display:block;font-size:13.5px}
.acct:empty{display:none}
.acct .btn{height:40px;width:100%;justify-content:center;font-size:14px}
.gl{width:18px;height:18px;flex:none}
.f-notice .btn{margin-top:10px;height:40px;font-size:14px}
.results{padding:0 4px}
.res{display:block;width:100%;text-align:left;padding:10px;border-radius:12px;font-size:14px;line-height:1.3}
.res:hover,.res:focus-visible{background:rgba(255,255,255,.55)}
.res b{display:block;font-size:12.5px;color:var(--accent);margin-bottom:2px}
.res span{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty-res{padding:14px;color:var(--muted);font-size:14px}

/* ---------- main ---------- */
.main{display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:18px;min-width:0}
.ibtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--ink)}
.ibtn:hover{background:rgba(255,255,255,.55)}
.ibtn:disabled{opacity:.35;cursor:default}
.crumb{min-width:0;flex:0 1 auto;max-width:34%;padding:0 4px}
.crumb-a{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb-b{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;padding:4px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;position:relative;height:36px;min-width:44px;padding:0 13px;border-radius:999px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.85);white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.8)}
.chip.cur{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px -6px rgba(90,103,208,.7)}
.chip.has::after{content:"";position:absolute;top:3px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--accent2);border:1.5px solid #fff}
.top-actions{display:flex;gap:2px;flex:none}
.view{min-height:0;position:relative}
.hidden{display:none !important}

/* ---------- home ---------- */
.home{height:100%;overflow:auto;border-radius:var(--r-lg);-webkit-overflow-scrolling:touch}
.home-in{max-width:1180px;margin:0 auto;padding:clamp(18px,3vw,36px)}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:20px;margin-bottom:22px}
.hero-k{font-size:14px;color:var(--muted);margin-bottom:10px}
.hero h1{font-size:clamp(34px,4.6vw,60px);font-weight:780;line-height:.98;letter-spacing:-.03em;margin-bottom:14px}
.hero p{font-size:17.5px;max-width:52ch;margin:0 0 18px;color:#48455F}
.hero-art{width:100%;max-width:460px;justify-self:end}
.cta-row{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 10px 22px -10px rgba(90,103,208,.8)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-glass{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9)}
.btn-glass:hover{background:rgba(255,255,255,.85)}
.ptable{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;padding:12px 14px 14px;border-radius:16px;overflow:hidden;
  background:linear-gradient(155deg,rgba(255,255,255,.86),rgba(255,255,255,.4) 52%,var(--tint) 125%);
  border:1px solid rgba(255,255,255,.9);box-shadow:0 14px 30px -20px rgba(60,62,120,.5),inset 0 1px 0 #fff;transition:transform .18s ease,box-shadow .18s ease}
.tile:hover{transform:translateY(-3px);box-shadow:0 22px 36px -22px rgba(60,62,120,.6),inset 0 1px 0 #fff}
.tile[data-g="phys"]{--tint:rgba(160,204,250,.95)}
.tile[data-g="org"]{--tint:rgba(148,222,194,.95)}
.t-head{display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:14px}
.t-head b{font-family:var(--f-display);font-size:40px;line-height:.95;font-weight:760;letter-spacing:-.03em;color:var(--ink)}
.t-name{font-weight:700;font-size:16px;line-height:1.22;margin-bottom:12px;min-height:2.44em;flex:1}
.t-wrap{display:block}
.t-meter{display:block;height:5px;border-radius:9px;background:rgba(45,42,68,.1);overflow:hidden}
.t-meter i{display:block;height:100%;background:var(--accent2);border-radius:9px}
.t-meta{font-size:12.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin:14px 2px 0;font-size:13.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid rgba(255,255,255,.9)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 2px 12px}
.sec-h h2{font-size:22px;font-weight:720}
.sec-h p{margin:0;font-size:14px;color:var(--muted)}

/* ---------- stage / board ---------- */
.stage{height:100%;display:flex;gap:12px;min-height:0}
body.rail-right .stage{flex-direction:row-reverse}
.rail{flex:none;width:60px;border-radius:20px;padding:8px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .tb{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;position:relative;color:#3C3956;flex:none}
.rail .tb:hover{background:rgba(255,255,255,.6)}
.rail .tb[aria-pressed="true"]{background:linear-gradient(160deg,#fff,rgba(255,255,255,.7));color:var(--accent);box-shadow:0 6px 14px -8px rgba(90,103,208,.8),inset 0 0 0 1.5px rgba(90,103,208,.45)}
.rail .tb.opt::after{content:"";position:absolute;right:5px;bottom:5px;border:4px solid transparent;border-right-color:currentColor;border-bottom-color:currentColor;opacity:.55;border-radius:1px}
.rail .tb:disabled{opacity:.3;cursor:default}
.rail-sep{width:28px;height:1px;background:var(--hair);margin:4px 0;flex:none}
.swatch{width:22px;height:22px;border-radius:50%;background:var(--sw,#33231F);box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 0 0 1px rgba(45,42,68,.25)}
.sizedot{display:block;border-radius:50%;background:currentColor;width:var(--d,8px);height:var(--d,8px)}
.rail .lab{font-size:10px;font-weight:700;line-height:1;margin-top:-2px;color:var(--muted)}
.board{flex:1;min-width:0;position:relative;border-radius:20px;overflow:hidden;background:var(--paper);
  box-shadow:0 30px 60px -34px rgba(60,62,120,.55),0 0 0 1px rgba(255,255,255,.9),0 0 0 7px rgba(255,255,255,.35)}
.board canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.board.pan canvas{cursor:grab}
.board.draw canvas{cursor:crosshair}
.thumb{position:absolute;right:4px;top:0;width:8px;border-radius:8px;background:rgba(45,42,68,.22);touch-action:none;cursor:pointer;transition:background .15s, width .15s}
.thumb:hover,.thumb.drag{background:rgba(90,103,208,.55);width:10px}
.status{position:absolute;bottom:14px;right:22px;pointer-events:none;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;
  background:rgba(255,252,249,.9);border:1px solid rgba(70,72,120,.12);box-shadow:0 6px 18px -10px rgba(60,62,120,.45);max-width:calc(100% - 40px)}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .dot{width:8px;height:8px;border-radius:50%;background:#BDB9D6;flex:none}
.status[data-s="saved"] .dot,.status[data-s="sol"] .dot{background:var(--accent2)}
.status[data-s="saving"] .dot{background:#E0B44A;animation:pulse 1s infinite}
.status[data-s="dirty"] .dot{background:#E0B44A}
.status[data-s="error"] .dot{background:#A5432F}
.status[data-s="error"]{color:#8E3A28;cursor:pointer;pointer-events:auto}
@keyframes pulse{50%{opacity:.35}}
.addspace{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;font-weight:700;font-size:14px;
  background:rgba(255,252,249,.94);border:1px solid rgba(70,72,120,.14);box-shadow:0 10px 24px -12px rgba(60,62,120,.55)}
.zoompill{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;
  background:rgba(255,252,249,.94);border:1px solid rgba(70,72,120,.14);box-shadow:0 10px 24px -12px rgba(60,62,120,.55)}
.zoompill b{color:var(--accent)}
.selbar{position:absolute;display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(255,252,249,.96);border:1px solid rgba(70,72,120,.16);box-shadow:0 10px 24px -12px rgba(60,62,120,.55)}
.selbar button{height:36px;padding:0 12px;border-radius:9px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.selbar button:hover{background:var(--wash)}
.selbar .danger{color:#A5432F}

/* ---------- popovers, dialogs, toast ---------- */
.pop{position:fixed;z-index:40;padding:12px;border-radius:18px;min-width:200px;max-width:300px;background:var(--glass-strong);
  -webkit-backdrop-filter:blur(24px) saturate(1.3);backdrop-filter:blur(24px) saturate(1.3);border:1px solid #fff;box-shadow:0 24px 50px -20px rgba(60,62,120,.5)}
.pop h3{font-size:13px;font-family:var(--f-body);font-weight:700;color:var(--muted);margin:2px 4px 8px;letter-spacing:0}
.pop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.sw i{width:30px;height:30px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),0 0 0 1px rgba(45,42,68,.2)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
.opt-list{display:grid;gap:2px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;border-radius:12px;font-size:15px;font-weight:700}
.opt:hover{background:rgba(255,255,255,.7)}
.opt[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:inset 0 0 0 1.5px rgba(90,103,208,.35)}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.opt.danger{color:#A5432F}
.seg{display:flex;gap:4px;padding:4px;background:rgba(45,42,68,.06);border-radius:12px;margin:0 2px 8px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13.5px;font-weight:700}
.seg button[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 2px 6px rgba(60,62,120,.15)}
.pop hr{border:0;border-top:1px solid var(--hair);margin:8px 2px}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(45,42,80,.22);display:grid;place-items:center;padding:16px}
.dialog{width:min(440px,100%);padding:22px;border-radius:22px;background:var(--glass-strong);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid #fff;box-shadow:var(--shadow)}
.dialog h2{font-size:21px;margin-bottom:8px}
.dialog p{margin:0 0 18px;color:#48455F}
.dialog .row{display:flex;justify-content:flex-end;gap:10px}
.btn-danger{background:#A5432F;color:#fff}
.sheet-dlg{width:min(980px,100%);height:min(92vh,100%);display:grid;grid-template-rows:auto auto minmax(0,1fr);padding:16px;border-radius:22px;background:var(--glass-strong);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid #fff;box-shadow:var(--shadow)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheet-h h2{font-size:21px}
.sheet-body{overflow:auto;border-radius:14px;background:#fff;-webkit-overflow-scrolling:touch}
.sheet-body img{display:block;width:100%;height:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;z-index:60;padding:11px 18px;border-radius:22px;max-width:min(560px,calc(100vw - 32px));text-align:center;font-weight:700;font-size:14px;
  background:rgba(45,42,68,.92);color:#fff;box-shadow:0 14px 30px -12px rgba(45,42,68,.6);transition:opacity .2s, transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim-side{display:none}

/* ---------- class forum ---------- */
.forum{height:100%;overflow:auto;border-radius:var(--r-lg);-webkit-overflow-scrolling:touch}
.forum-in{max-width:880px;margin:0 auto;padding:clamp(16px,3vw,32px)}
.f-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.f-k{font-size:14px;color:var(--muted);margin-bottom:6px}
.f-head h2{font-size:clamp(26px,3.2vw,36px);font-weight:760;line-height:1.05;letter-spacing:-.02em}
.f-head p{margin:10px 0 0;max-width:58ch;color:#48455F;font-size:16.5px}
.f-head .btn:disabled{opacity:.45;cursor:default}
.composer{background:var(--glass-strong);border:1px solid #fff;border-radius:20px;padding:14px;box-shadow:var(--shadow);margin-bottom:18px;display:grid;gap:10px}
.composer textarea{width:100%;min-height:88px;resize:vertical;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);background:#fff;border:1px solid var(--hair);border-radius:14px;padding:12px 14px;-webkit-user-select:text;user-select:text;outline:none}
.composer textarea:focus{border-color:rgba(90,103,208,.55)}
.composer textarea::placeholder{color:#9894B0}
.pad-bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.pb{height:40px;min-width:40px;padding:0 10px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;font-weight:700;color:#3C3956}
.pb:hover{background:rgba(255,255,255,.85)}
.pb[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:inset 0 0 0 1.5px rgba(90,103,208,.45)}
.pb .dotc{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px #fff,0 0 0 1px rgba(45,42,68,.25)}
.pb-sep{width:1px;height:24px;background:var(--hair);margin:0 4px}
.pad{position:relative;border-radius:14px;overflow:hidden;background-color:#FCFCFF;border:1px solid var(--hair);
  background-image:linear-gradient(rgba(90,103,208,.11) 1px,transparent 1px);background-size:100% 34px;background-position:0 33px}
.pad canvas{display:block;width:100%;touch-action:none}
.pad-hint{position:absolute;left:16px;top:12px;font-size:14px;color:var(--muted);pointer-events:none}
.c-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.c-note{flex:1;font-size:13.5px;color:var(--muted);min-width:180px}
.c-foot .btn:disabled{opacity:.45;cursor:default}
.c-btns{display:flex;gap:10px;margin-left:auto}
.f-notice{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.62);border:1px solid #fff;font-size:14.5px;margin-bottom:16px;color:#48455F}
.feed{display:grid;gap:12px}
.post{background:rgba(255,253,250,.88);border:1px solid #fff;border-radius:18px;padding:14px 16px;box-shadow:0 14px 28px -22px rgba(60,62,120,.6)}
.post header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;background:var(--sand)}
.who{flex:1;min-width:0;line-height:1.2}
.who b{font-size:15px}
.who .tm{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--wash);color:var(--accent);vertical-align:2px}
.post .del{font-size:13px;font-weight:700;color:var(--muted);padding:8px 10px;border-radius:9px}
.post .del:hover{background:var(--wash);color:#A5432F}
.post .txt{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.55;-webkit-user-select:text;user-select:text}
.post .txt:last-child{margin-bottom:0}
.post canvas.ink{display:block;width:100%;border-radius:12px;background:#FCFCFF;border:1px solid var(--hair)}
.f-empty{padding:30px 18px;text-align:center;color:var(--muted);border:1.5px dashed rgba(90,103,208,.3);border-radius:18px}
.chip-forum{display:inline-flex;align-items:center;gap:6px}
.chip-forum svg{width:18px;height:18px}
.chip-forum .fc:empty{display:none}
.chip-forum .fc{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:rgba(90,103,208,.16);font-size:12px;line-height:20px}
.chip-forum.cur .fc{background:rgba(255,255,255,.28)}
.sec-f{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.sec-f:empty{display:none}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:6px}
.rec{display:flex;flex-direction:column;gap:6px;text-align:left;padding:13px 14px;border-radius:16px;background:rgba(255,255,255,.6);border:1px solid #fff;font-size:14.5px;line-height:1.35}
.rec:hover{background:rgba(255,255,255,.85)}
.rec .r-sec{font-size:12.5px;font-weight:700;color:var(--accent)}
.rec .r-txt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rec .r-by{font-size:12.5px;color:var(--muted)}

/* ---------- motion ---------- */
.bub{animation:rise 4.2s ease-in infinite;transform-box:fill-box}
.bub:nth-child(2){animation-delay:1.1s}.bub:nth-child(3){animation-delay:2.3s}.bub:nth-child(4){animation-delay:3.1s}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
@media (prefers-reduced-motion:reduce){.bub{animation:none}.tile,.app{transition:none}}

/* ---------- focus mode & responsive ---------- */
body.focus .app{grid-template-columns:0 minmax(0,1fr);gap:0}
body.focus .side{visibility:hidden}
@media (max-width:1080px){
  .app{grid-template-columns:minmax(0,1fr)}
  body.focus .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:45;left:10px;top:10px;bottom:10px;width:min(330px,86vw);transform:translateX(-112%);transition:transform .26s ease;visibility:visible !important;background:var(--glass-strong)}
  body.drawer .side{transform:none}
  body.drawer .scrim-side{display:block;position:fixed;inset:0;z-index:44;background:rgba(45,42,80,.18)}
  .crumb{max-width:30%}
  #focusBtn{display:none}
}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .hero-art{justify-self:center;max-width:340px;order:-1}
  .crumb{display:none}
  .stage{flex-direction:column-reverse !important;gap:8px}
  .rail{width:auto;height:auto;flex-direction:row;padding:6px;overflow-x:auto;overflow-y:hidden;border-radius:18px}
  .rail-sep{width:1px;height:28px;margin:0 4px}
  .status{bottom:8px;right:10px;font-size:12px}
  .app{gap:8px;padding:8px}
  .main{gap:8px}
}

/* ---------------- download ---------------- */
async function downloadImage() {
  if (!S.dl || !S.cur) return;
  const it = BYID.get(S.cur), d = getDoc(it.id), H = Board.docH();
  let k = 1.5; while (W * k * H * k > 14e6 && k > 0.5) k -= 0.1;
  const c = document.createElement('canvas'); c.width = Math.round(W * k); c.height = Math.round(H * k);
  const ctx = c.getContext('2d'); ctx.setTransform(k, 0, 0, k, 0, 0);
  const img = Img.get(it); paintSheet(ctx, it, d.paper, 0, H, img, img.complete && img.naturalWidth > 0, k);
  if (S.role !== 'student' || S.showSol) for (const s of d.strokes) drawStroke(ctx, s);
  if (S.role === 'student') for (const s of getPDoc(it.id).strokes) drawStroke(ctx, s);
  ctx.fillStyle = '#686583'; ctx.font = '13px "Atkinson Hyperlegible", sans-serif'; ctx.textBaseline = 'bottom';
  ctx.fillText(`EC025 Chemistry 2, Chapter ${it.ch.n} ${it.ch.title}, ${(it.sec.num ? it.sec.num + ' ' : '') + it.sec.title}, ${it.label}`, QX, H - 12);
  try {
    const blob = await new Promise((res, rej) => c.toBlob(b => (b ? res(b) : rej(new Error('blob'))), 'image/png'));
    const name = `EC025 Ch${String(it.ch.n).padStart(2, '0')} ${(it.sec.num || it.sec.title).replace(/[^\w.\- ]/g, '')} ${it.short.replace(/[^\w\- ]/g, '-')}.png`;
    await S.dl.save({ filename: name, data: blob }); toast('Image saved');
  } catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'unavailable' ? 'Downloads aren\'t available here.' : 'Couldn\'t make the image. Try again.'); }
}

/* ---------------- class forum ----------------
   forum/{uid}            one doc per person: { v, posts:[{id, s(section), at, t(text), ink, h}] }
   forum/{uid}/p/{postId} handwriting for one post: { s, h, st:[encoded strokes] }

const F = { ready: false, users: new Map(), staff: new Set(), me: null, canPost: null, ink: new Map(), sec: null, drafts: new Map(), counts: new Map(), names: new Map(), needSignIn: false };
// On the public site each person's forum entry also carries their Google display name and photo, so classmates see who wrote
function ownMeta() { const w = S.who; if (S.backend !== 'firebase' || !w) return {}; return { name: (w.name || w.email.split('@')[0]).slice(0, 80), photo: /^https:\/\//.test(w.photo) ? w.photo.slice(0, 500) : '' }; }
function keptMeta(v) { const o = {}; if (v && typeof v.name === 'string') o.name = v.name.slice(0, 80); if (v && typeof v.photo === 'string' && /^https:\/\//.test(v.photo)) o.photo = v.photo.slice(0, 500); return o; }

  const cols = ['#C9C2F7', '#BFE0F7', '#BCEBD9', '#FBE7A6', '#D8D3F2'], ch = (name || '?').trim().charAt(0).toUpperCase() || '?';

  return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="${cols[h % cols.length]}"/><text x="20" y="26" font-size="17" font-family="system-ui,sans-serif" font-weight="700" text-anchor="middle" fill="#2D2A44">${esc(ch)}</text></svg>`);
}
const PADW = 1000;

async function forumInit() {

  try {
    const st = await withRetry(() => S.db.doc('config/staff').get()); const v = st.exists ? st.data() : null;
    if (v && Array.isArray(v.ids)) v.ids.forEach(x => typeof x === 'string' && F.staff.add(x));

async function submitPost() {

    if (strokes.length) {
      const enc = strokes.map(encStroke); if (enc.join('').length > 230000) throw { code: 'too_much_ink' };

function renderFeed() {

    feed.querySelectorAll('.post').forEach(el => el.remove());
    if ((!S.db && S.role !== 'pending') || F.needSignIn) { if (empty) empty.remove(); return; }
    if (!empty) { empty = document.createElement('div'); empty.className = 'f-empty'; feed.appendChild(empty); }
    empty.textContent = F.ready ? 'No reflections yet for this section. Be the first to share one.' : 'Loading reflections…';
    return;
  }
  if (empty) empty.remove();
  const old = new Map([...feed.querySelectorAll('.post')].map(el => [el.dataset.key, el]));
  for (const p of list) { const key = p.uid + '/' + p.id; let el = old.get(key); if (el) old.delete(key); else el = makePost(p); feed.appendChild(el); }
  old.forEach(el => el.remove());
  nameAll();
}
function makePost(p) {
  const el = document.createElement('article'); el.className = 'post'; el.dataset.key = p.uid + '/' + p.id; el.dataset.uid = p.uid;
  el.innerHTML = '<header><img class="av" alt=""><div class="who"><b class="nm">Classmate</b><span class="badge hidden">Lecturer</span><span class="tm"></span></div></header>';
  el.querySelector('.tm').textContent = fmtTime(p.at);
  if (F.staff.has(p.uid)) el.querySelector('.badge').classList.remove('hidden');
  if (p.uid === F.me || S.role === 'lecturer') { const b = document.createElement('button'); b.type = 'button'; b.className = 'del'; b.textContent = 'Delete'; b.onclick = () => deletePost(p.uid, p.id); el.querySelector('header').appendChild(b); }
  if (p.t) { const t = document.createElement('p'); t.className = 'txt'; t.textContent = p.t; el.appendChild(t); }
  if (p.ink) { const c = document.createElement('canvas'); c.className = 'ink'; c.style.aspectRatio = `${PADW} / ${Math.max(40, p.h || 300)}`; c.setAttribute('role', 'img'); c.setAttribute('aria-label', 'Handwritten reflection'); el.appendChild(c); inkObs.observe(c); }
  return el;
}
async function nameAll() {
  const els = [...document.querySelectorAll('#feed .post, #homePanel .rec')]; const ids = [...new Set(els.map(e => e.dataset.uid).filter(Boolean))];
  if (!ids.length) return;
  let ps = {}; try { if (S.user && S.user.profiles) ps = (await S.user.profiles(ids)) || {}; } catch {}
  for (const el of els) {
    const uid = el.dataset.uid, p = ps[uid], nm = el.querySelector('.nm');
    const stored = F.names.get(uid), name = (p && p.name) || (stored && stored.name) || '';
    if (nm) nm.textContent = uid === F.me ? 'You' : (name || (F.staff.has(uid) ? 'Lecturer' : 'Classmate'));
    const av = el.querySelector('.av');
    if (av) { const src = (p && p.avatarUrl) || (stored && stored.photo) || avatarFor(name || 'Classmate'); if (av.getAttribute('src') !== src) { av.referrerPolicy = 'no-referrer'; av.onerror = () => { av.onerror = null; av.src = avatarFor(name || 'Classmate'); }; av.src = src; } }
  }
}
const inkObs = 'IntersectionObserver' in window
  ? new IntersectionObserver(ents => { for (const en of ents) if (en.isIntersecting) { inkObs.unobserve(en.target); loadInk(en.target); } }, { rootMargin: '400px' })
  : { observe: c => loadInk(c), unobserve() {} };
async function loadInk(c) {
  const post = c.closest('.post'); if (!post) return; const key = post.dataset.key; let v = F.ink.get(key);
  if (!v) {
    try {
      const [uid, pid] = key.split('/'); const snap = await withRetry(() => S.db.doc(`forum/${uid}/p/${pid}`).get()); const d = snap.exists ? snap.data() : null;
      v = { h: clamp(+(d && d.h) || 300, 40, 3000), strokes: d && Array.isArray(d.st) ? d.st.slice(0, 6000).map(decStroke).filter(Boolean) : [] };
      F.ink.set(key, v);
    } catch { return; }
  }
  c._ink = v; c.style.aspectRatio = `${PADW} / ${v.h}`; paintInk(c);
}
function paintInk(c) {
  const v = c._ink; if (!v) return; const w = c.clientWidth; if (!w) return;
  const dpr = Math.min(devicePixelRatio || 1, 2.5), k = w / PADW;
  c.width = Math.round(w * dpr); c.height = Math.round(v.h * k * dpr);
  const ctx = c.getContext('2d'); ctx.setTransform(k * dpr, 0, 0, k * dpr, 0, 0); for (const s of v.strokes) drawStroke(ctx, s);
}
function wireForum() {
  Pad.init();
  new ResizeObserver(() => document.querySelectorAll('#feed canvas.ink').forEach(paintInk)).observe($('#feed'));
  $('#fWrite').onclick = async () => {
    const c = $('#composer'); if (!c.classList.contains('hidden')) { c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
    $('#fWrite').disabled = true; const ok = await canPostProbe(); updateComposerAvail();
    if (!ok) { if (ok === null) { $('#fWrite').disabled = false; toast('Couldn\'t reach the forum. Check the connection and try again.'); } return; }
    c.classList.remove('hidden'); Pad.size();
  };
  $('#fCancel').onclick = () => {
    const has = $('#fText').value.trim() || Pad.strokes.length;
    const close = () => { $('#fText').value = ''; Pad.reset(); F.drafts.delete(F.sec); $('#composer').classList.add('hidden'); };
    if (has) confirmDlg('Discard this reflection?', 'What you typed and wrote on the pad will be cleared.', 'Discard', close); else close();
  };
  $('#fPost').onclick = () => submitPost();
  $('#padBar').onclick = e => {
    const t = e.target.closest('[data-pt]'), c = e.target.closest('[data-pc]');
    if (t) { Pad.tool = t.dataset.pt; document.querySelectorAll('[data-pt]').forEach(b => b.setAttribute('aria-pressed', String(b === t))); }
    if (c) { Pad.color = c.dataset.pc; Pad.tool = 'pen'; document.querySelectorAll('[data-pc]').forEach(b => b.setAttribute('aria-pressed', String(b === c))); document.querySelectorAll('[data-pt]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pt === 'pen'))); }
  };
  $('#pUndo').onclick = () => Pad.undo();
  $('#pClear').onclick = () => Pad.clear();
  $('#pMore').onclick = () => Pad.more();
}

/* ---------------- boot ---------------- */
async function boot() {
  Board.init(); wire();
  try {
    const r = await fetch('data.json'); DATA = await r.json();
  } catch {
    $('#homePanel').innerHTML = '<div class="home-in"><h1>Questions didn\'t load</h1><p>Reload the page to try again.</p></div>'; return;
  }
  for (const ch of DATA.chapters) { CHAPTERS.set(ch.n, ch); for (const sec of ch.sections) { sec.ch = ch; SECS.set(sec.id, sec); for (const it of sec.items) { it.ch = ch; it.sec = sec; it.idx = ITEMS.length; ITEMS.push(it); BYID.set(it.id, it); } } }
  buildRail(); renderNav(); route();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => Board.dirtyBase());
  initCaps();
}
boot();
</script>
